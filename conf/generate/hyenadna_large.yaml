# @package _global_
defaults:
  - /generate_common
  - _self_

checkpoint: LongSafari/hyenadna-large-1m-seqlen-hf
revision: 0a629abf9c7f85b4ec9aa6a1aefa3adcf1907446

# Index into outputs.hidden_states; -1 is the last hidden state.
layer_index: -1

# Effective batch is min(batch_size, gen_chunk_size), so raise both together.
batch_size: 1024

update_config: false
train_output_path: data/hg38/train_hyenadna_large_${seq_length}_hg38_per_token.h5
val_output_path: data/hg38/val_hyenadna_large_${seq_length}_hg38_per_token.h5
test_output_path: data/hg38/test_hyenadna_large_${seq_length}_hg38_per_token.h5
