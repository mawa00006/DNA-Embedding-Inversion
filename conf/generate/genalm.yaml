# @package _global_
defaults:
  - /generate_common
  - _self_

checkpoint: AIRI-Institute/gena-lm-bert-base-t2t
revision: 4f1352bd4e820f1dba341047f54ad7795e083bf2

# Index into outputs.hidden_states; -1 is the last hidden state.
layer_index: -1

# Effective batch is min(batch_size, gen_chunk_size), so raise both together.
batch_size: 1024

update_config: false
train_output_path: data/hg38/train_genalm_${seq_length}_hg38_per_token.h5
val_output_path: data/hg38/val_genalm_${seq_length}_hg38_per_token.h5
test_output_path: data/hg38/test_genalm_${seq_length}_hg38_per_token.h5
