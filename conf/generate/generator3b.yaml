# @package _global_
defaults:
  - /generate_common
  - _self_

checkpoint: GenerTeam/GENERator-eukaryote-3b-base
revision: 7515b17659f092997335226c3fb6aafd06c0add9

# Index into outputs.hidden_states; -1 is the last hidden state.
layer_index: -1

# 3072-wide, 3B params, fp32 -- needs an L40S. Effective batch is
# min(batch_size, gen_chunk_size), so raise both together; kept modest here
# pending the cluster smoke test.
batch_size: 256

update_config: false
train_output_path: data/hg38/train_generator3b_${seq_length}_hg38_per_token.h5
val_output_path: data/hg38/val_generator3b_${seq_length}_hg38_per_token.h5
test_output_path: data/hg38/test_generator3b_${seq_length}_hg38_per_token.h5
