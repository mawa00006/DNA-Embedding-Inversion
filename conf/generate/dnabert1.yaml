# @package _global_
defaults:
  - /generate_common
  - _self_

checkpoint: zhihan1996/DNA_bert_6
revision: c56e67ea5827e0ddc67ef059addcf71569b1216e

# Index into outputs.hidden_states; -1 is the last hidden state.
layer_index: -1

# Effective batch is min(batch_size, gen_chunk_size), so raise both together.
batch_size: 1024

update_config: false
train_output_path: data/hg38/train_dnabert1_${seq_length}_hg38_per_token.h5
val_output_path: data/hg38/val_dnabert1_${seq_length}_hg38_per_token.h5
test_output_path: data/hg38/test_dnabert1_${seq_length}_hg38_per_token.h5
