###############################################
# Hydra configuration for model evaluation
# Modify values via CLI overrides, e.g.:
#   python evaluate.py run_dir=outputs/train-2025-10-21-12-00-00
#   python evaluate.py  # Auto-detects latest run
###############################################

# Run directory to evaluate (if null, will auto-detect latest)
run_dir: null

# Base directory to search for training runs
runs_base_dir: outputs # This points to the parent directory of the eval run

# Device for inference
device: cuda:0

# Maximum number of samples to evaluate (null = all)
max_samples: null

# For multi-length training runs (data.multi=true) in SINGLE-run mode, pick
# which per-length test file to evaluate against. Must be one of the run's
# data.seq_lengths. Ignored for regular (single-length) runs.
eval_seq_length: null

# For multi-length training runs evaluated as a Hydra MULTIRUN (a sweep dir of
# per-architecture sub-runs), the list of per-length test files to evaluate each
# sub-model against. Every (architecture, length) pair becomes its own
# run_<arch>_L<L> sub-run inside the single eval output directory, so the
# standard cross-length aggregator runs over it unchanged -- no separate per-L
# directories. If null, every length in each run's data.seq_lengths is used.
eval_seq_lengths: null

# Out-of-distribution evaluation against the 1000 Genomes test sets. When true,
# each per-length test file is redirected from its hg38 path to the matching
# 1000g file ("hg38" -> "1000g"); training-time (hg38) normalization stats are
# still used. Works for the multi-length model: lengths whose 1000g file is
# missing are skipped. Point hydra.run.dir at an outputs_1000g/ dir.
eval_ood_1000g: false

# Only generate plots from existing results (skips inference)
only_plots: false

# Skip per-run plots and only generate aggregate comparison plots
aggregate_only: false

# Run ONLY the identification block (skips the standard reconstruction eval).
identification_only: true

# Identification evaluation (per-individual 1000G cohort).
# The block runs after the standard eval if `enabled: true` and the H5
# matching `h5_pattern` exists for each requested mode. {fm}, {L}, {mode}
# are filled from the per-run config and the mode list below.
identification:
  enabled: true
  # Report the operational full-cohort attack and a conservative companion
  # stratum that removes any whole locus containing an exact training sequence.
  strict_train_unseen_loci: true
  # Training lengths to run identification for in identification_only mode. Must
  # have matching test_{fm}_{L}_1000g_id_{mode}.h5 files (generated by
  # prepare_and_generate_identification.sh, whose LENGTHS must include these).
  seq_lengths: [25]
  h5_pattern: "data/1000g/test_{fm}_{L}_1000g_id_{mode}.h5"
  modes: [random, snp_enriched]
  # k ranges in powers of two up to the total loci generated per individual
  # (num_loci = 4096 in prepare_and_generate_identification.sh). The long tail
  # is what lets identification_model fit (d, r) and extrapolate k-required.
  k_grid: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
  thresholds: [0.5, 0.9, 0.95, 0.99]
  # A repetition is one random nested ordering of loci. The scorer streams an
  # N x N accumulator and never allocates the previous K x N x N tensor. One
  # repetition already averages identification over all N=1000 targets; increase
  # this only when uncertainty over locus selection is explicitly required.
  num_target_repetitions: 1
  inference_batch_size: 256
  seed: 42
  # Locus-blind identification: attacker has only the predicted sequences (no
  # locus labels) and a candidate panel. Predicted sequences are aligned to
  # hg38 with BWA-MEM (substitution-only), then scored against candidate
  # haplotypes reconstructed from phased VCFs at each hit position.
  locus_blind:
    enabled: true
    reference: "data/hg38.fa"
    vcf_dir: "data/1000g_vcfs"
    top_h_hits: 5
    bwa_threads: 8
    workdir_root: "outputs/locus_blind_workdirs"
    # Opt-in recovery for a run that failed after BWA completed. Reuse occurs
    # only when the stored FASTA exactly matches the current reconstructions;
    # the reused SAM is then checked for every expected query ID.
    reuse_alignment_if_present: false

# Hydra settings
hydra:
  run:
    dir: outputs/evaluate-${now:%Y-%m-%d-%H-%M-%S}
  sweep:
    dir: outputs/evaluate-${now:%Y-%m-%d-%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: true
  job_logging:
    root:
      level: INFO
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    formatters:
      simple:
        format: '%(asctime)s | %(levelname)s | %(message)s'
